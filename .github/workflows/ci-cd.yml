
name: CI and CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  ci:
    name: Test and build Docker image
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Docker image
        run: docker build --tag node-ci-cd-demo:${{ github.sha }} .

  cd:
    name: Deploy to local Docker
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify Docker is running
        shell: powershell
        run: |
          docker info
          if ($LASTEXITCODE -ne 0) {
            throw "Docker Desktop is not running or Docker is unavailable."
          }

      - name: Build Docker image
        shell: powershell
        run: |
          docker build -t node-ci-cd-demo:latest .
          if ($LASTEXITCODE -ne 0) {
            throw "Docker image build failed."
          }

      - name: Deploy container
        shell: powershell
        run: |
          $existing = docker ps -aq --filter "name=^/node-ci-cd-demo$"

          if ($existing) {
            docker rm -f node-ci-cd-demo
            if ($LASTEXITCODE -ne 0) {
              throw "Could not remove the existing container."
            }
          }

          docker run -d `
            --name node-ci-cd-demo `
            --restart unless-stopped `
            -p 3001:3000 `
            node-ci-cd-demo:latest

          if ($LASTEXITCODE -ne 0) {
            throw "Container deployment failed."
          }

      - name: Verify deployment
        shell: powershell
        run: |
          Start-Sleep -Seconds 5

          $response = $null
          try {
            $response = Invoke-RestMethod `
              -Uri "http://localhost:3001/health" `
              -TimeoutSec 10
          }
          catch {
            docker logs node-ci-cd-demo
            throw "Deployment health check failed."
          }

          if ($response.status -ne "OK") {
            docker logs node-ci-cd-demo
            throw "Health endpoint did not return status OK."
          }

          Write-Host "Deployment successful!"
          $response | ConvertTo-Json
